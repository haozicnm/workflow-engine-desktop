name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        type: boolean
        default: true
      run_clippy:
        description: 'Run clippy'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Rust backend ───
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libxdo-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (CLI)
        run: cargo check --workspace

      - name: cargo check (GUI)
        run: cargo check --workspace --features gui

      - name: cargo clippy (CLI + GUI)
        run: cargo clippy --workspace --features gui -- -D warnings

      - name: cargo test (unit + integration)
        run: cargo test

  # ─── Frontend TypeScript ───
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate desktop bundle config
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); const t=require('./src-tauri/tauri.conf.json'); const cap=require('./src-tauri/capabilities/default.json'); const c=fs.readFileSync('./src-tauri/Cargo.toml','utf8'); const g=fs.readFileSync('./src-tauri/src/bin/gui.rs','utf8'); const acl=fs.readFileSync('./src-tauri/permissions/desktop-ipc.toml','utf8'); if(p.version!==t.version) throw new Error('Version mismatch: package.json='+p.version+', tauri.conf.json='+t.version); const cargoVersion=c.match(/^version = "([^"]+)"/m)?.[1]; if(cargoVersion!==p.version) throw new Error('Version mismatch: package.json='+p.version+', Cargo.toml='+cargoVersion); if(t.mainBinaryName!=='workflow-engine-gui') throw new Error('Desktop bundle must use workflow-engine-gui'); if(!c.includes('default-run = \"workflow-engine-gui\"')) throw new Error('Cargo default-run must select workflow-engine-gui'); if(t.bundle.resources['../dist']!=='dist/') throw new Error('Desktop bundle must preserve the dist directory structure'); if(!cap.windows.includes('main')||!cap.permissions.includes('core:event:allow-listen')||!cap.permissions.includes('desktop-ipc')||!cap.remote?.urls?.includes('http://127.0.0.1:19529')) throw new Error('Main window and its loopback origin must allow desktop IPC'); const commands=[...g.matchAll(/workflow_engine::commands::\w+::(\w+),/g)].map(m=>m[1]); const allowed=[...acl.matchAll(/"(\w+)"/g)].map(m=>m[1]); const missing=commands.filter(command=>!allowed.includes(command)); const stale=allowed.filter(command=>!commands.includes(command)); if(missing.length||stale.length) throw new Error('IPC permission mismatch: missing='+missing.join(',')+', stale='+stale.join(',')); console.log('Desktop bundle:',p.version,t.mainBinaryName,'commands:',commands.length)"

      - name: Unit tests
        run: npm test -- --run

      - name: Production build + type check
        run: npm run build

  # ─── Template validation ───
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          find library -name "*.wf.json" -print0 | while IFS= read -r -d '' f; do
            echo "Validating $f..."
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All template JSON files valid"

      - name: Validate catalog entries
        run: |
          python3 -c "
          import os, json
          # Check all catalog entries have valid files
          for f in os.listdir('library'):
              if f.endswith('.wf.json'):
                  cat = f.replace('.wf.json', '')
                  cat_path = os.path.join('library', cat, f)
                  if not os.path.exists(cat_path):
                      print(f'WARNING: catalog entry {f} not found at {cat_path}')
          # Check all entries in catalog.toml reference existing files
          print('Template structure check passed')
          for root, dirs, files in os.walk('library'):
              for f in files:
                  if f.endswith('.wf.json'):
                      print(f'  {os.path.join(root, f)}')
          "
