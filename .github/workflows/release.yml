        with:
          name: workflow-engine-x64-tarball
          path: workflow-engine-*-linux-x64.tar.gz

  # ═══════════════════════════════════════════
  # Windows zip + Tauri NSIS installer
  # ═══════════════════════════════════════════
  build-windows:
    name: Windows (zip + NSIS)
    needs: release-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust & Node
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            node_modules
          key: win-v2-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            win-v2-${{ runner.os }}-

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend (HTTP server + CLI)
        working-directory: src-tauri
        run: cargo build --release --bin workflow-engine --bin wf-cli

      - name: Create python-runtime placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/python-runtime/wheels
          Set-Content -Path src-tauri/python-runtime/wheels/.gitkeep -Value "placeholder"
          New-Item -ItemType Directory -Force -Path src-tauri/python-runtime/playwright-browsers
          Set-Content -Path src-tauri/python-runtime/playwright-browsers/.gitkeep -Value "placeholder"

      - name: Prepare optional Windows signing certificate
        id: certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "certificate_path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "tauri_config=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning "Windows signing certificate is absent; this is only valid for a manual test build."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "workflow-engine-windows-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE_BASE64 -replace '\s', ''))
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

          # Tauri invokes signCommand after binary patching and before NSIS packaging,
          # then signs the installer itself. An absolute script path avoids cwd ambiguity.
          $signScript = Join-Path (Get-Location).Path "scripts\sign-windows.ps1"
          $signingConfigPath = Join-Path $env:RUNNER_TEMP "workflow-engine-tauri-signing.json"
          $signingConfig = @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = "powershell.exe"
                  args = @(
                    "-NoProfile",
                    "-NonInteractive",
                    "-ExecutionPolicy", "Bypass",
                    "-File", $signScript,
                    "-RequireSignature",
                    "-Path", "%1"
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 6 -Compress
          [IO.File]::WriteAllText($signingConfigPath, $signingConfig, [Text.UTF8Encoding]::new($false))

          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "certificate_path=$certificatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tauri_config=$signingConfigPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Tauri NSIS installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PATH: ${{ steps.certificate.outputs.certificate_path }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $signingConfig = "${{ steps.certificate.outputs.tauri_config }}"
          if ([string]::IsNullOrWhiteSpace($signingConfig)) {
            npm run tauri -- build --bundles nsis --features gui
          }
          else {
            npm run tauri -- build --bundles nsis --features gui --config $signingConfig
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign and verify Windows executables
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PATH: ${{ steps.certificate.outputs.certificate_path }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Tauri NSIS installer was not found." }
          $requireSignature = "${{ steps.certificate.outputs.enabled }}" -eq "true"

          $portableTargets = @(
            (Resolve-Path "src-tauri/target/release/workflow-engine.exe").Path,
            (Resolve-Path "src-tauri/target/release/wf-cli.exe").Path
          )
          & .\scripts\sign-windows.ps1 -Path $portableTargets -RequireSignature:$requireSignature

          # The GUI binary and installer are signed by Tauri's signCommand at the
          # correct bundling stages; verify them independently without re-signing.
          $packagedTargets = @(
            (Resolve-Path "src-tauri/target/release/workflow-engine-gui.exe").Path,
            $installer.FullName
          )
          & .\scripts\sign-windows.ps1 -Path $packagedTargets -VerifyOnly -RequireSignature:$requireSignature

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "workflow-engine-windows-signing.pfx") -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "workflow-engine-tauri-signing.json") -Force -ErrorAction SilentlyContinue

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== Packaging zip for Windows ==="
          Get-ChildItem src-tauri/target/release/*.exe | ForEach-Object { Write-Host $_.FullName }
          if (-not (Test-Path dist)) { throw "Frontend dist directory is missing." }
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ("${{ github.ref_type }}" -ne "tag") { $version = (Get-Content package.json -Raw | ConvertFrom-Json).version }
          $pkgDir = "workflow-engine-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkgDir
          Copy-Item src-tauri/target/release/workflow-engine-gui.exe $pkgDir/
          Copy-Item src-tauri/target/release/workflow-engine.exe $pkgDir/
          Copy-Item src-tauri/target/release/wf-cli.exe $pkgDir/
          Copy-Item -Recurse dist $pkgDir/
          Copy-Item -Recurse src-tauri/sidecars $pkgDir/sidecars
          Copy-Item -Recurse src-tauri/templates $pkgDir/templates
          Copy-Item src-tauri/node-schema.json $pkgDir/
          Copy-Item -Recurse src-tauri/python-runtime $pkgDir/python-runtime
          $lines = @(
            '@echo off',
            'title Workflow Engine',
            'cd /d "%~dp0"',
            'start "" "workflow-engine-gui.exe"',
            'echo Workflow Engine desktop started'
          )
          $lines | Set-Content -Path "$pkgDir/start.bat" -Encoding ASCII
          $serverLines = @(
            '@echo off',
            'title Workflow Engine Server',
            'cd /d "%~dp0"',
            'start /MIN "" "workflow-engine.exe"',
            'echo Waiting for server...',
            ':wait',
            'ping 127.0.0.1 -n 2 > nul',
            'curl -s http://localhost:19529/api/health >nul 2>&1',
            'if errorlevel 1 goto wait',
            'echo Server ready: http://localhost:19529',
            'start http://localhost:19529'
          )
          $serverLines | Set-Content -Path "$pkgDir/server-start.bat" -Encoding ASCII
          Compress-Archive -Path $pkgDir -DestinationPath "workflow-engine-$version-windows-x64.zip" -Force

      - name: Generate checksums and signing report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ("${{ github.ref_type }}" -ne "tag") { $version = (Get-Content package.json -Raw | ConvertFrom-Json).version }
          $zip = Get-Item "workflow-engine-$version-windows-x64.zip"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Tauri NSIS installer was not found." }

          $checksumLines = @($zip, $installer) | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          }
          $checksumLines | Set-Content -Path "workflow-engine-$version-windows-x64-SHA256SUMS.txt" -Encoding utf8

          $signedFiles = @(
            (Get-Item "src-tauri/target/release/workflow-engine-gui.exe"),
            (Get-Item "src-tauri/target/release/workflow-engine.exe"),
            (Get-Item "src-tauri/target/release/wf-cli.exe"),
            $installer
          )
          $reportLines = @("file`tstatus`tsigner`tthumbprint")
          foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $subject = if ($null -eq $signature.SignerCertificate) { "" } else { $signature.SignerCertificate.Subject }
            $thumbprint = if ($null -eq $signature.SignerCertificate) { "" } else { $signature.SignerCertificate.Thumbprint }
            $reportLines += "$($file.Name)`t$($signature.Status)`t$subject`t$thumbprint"
          }
          $reportLines | Set-Content -Path "workflow-engine-$version-windows-x64-signing.tsv" -Encoding utf8
          $reportLines | ForEach-Object { Write-Host $_ }

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: workflow-engine-windows-zip
          path: workflow-engine-*-windows-x64.zip
          if-no-files-found: error

      - name: Upload installer and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: workflow-engine-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            workflow-engine-*-windows-x64-SHA256SUMS.txt
            workflow-engine-*-windows-x64-signing.tsv
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-arm64
      - build-x64
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          required=(
            "workflow-engine_${version}_arm64.deb"
            "workflow-engine-${version}-linux-arm64.tar.gz"
            "workflow-engine_${version}_amd64.deb"
            "workflow-engine-${version}-linux-x64.tar.gz"
            "workflow-engine-${version}-windows-x64.zip"
            "Workflow Engine_${version}_x64-setup.exe"
            "workflow-engine-${version}-windows-x64-SHA256SUMS.txt"
            "workflow-engine-${version}-windows-x64-signing.tsv"
          )
          missing=0
          for name in "${required[@]}"; do
            if ! find release-artifacts -type f -name "$name" -print -quit | grep -q .; then
              echo "::error::Missing release asset: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          find release-artifacts -type f -printf '%P\n' | sort

      - name: Create release after all builds and signature checks pass
        uses: softprops/action-gh-release@v2
        with:
          name: Workflow Engine ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
