name: Release Build

# 手动触发 + 推送 tag 触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release-preflight:
    name: Release signing policy
    runs-on: ubuntu-latest
    outputs:
      windows_signing: ${{ steps.signing.outputs.windows_signing }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version and desktop config
        shell: bash
        run: |
          node scripts/validate-desktop-config.cjs
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
            actual="$(node -p "require('./package.json').version")"
            if [ "$expected" != "$actual" ]; then
              echo "::error::Tag version $expected does not match package.json, Cargo.toml and tauri.conf.json version $actual."
              exit 1
            fi
          fi

      - name: Check Windows signing requirements
        id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "${WINDOWS_CERTIFICATE_BASE64:-}" ]; then
            echo "windows_signing=true" >> "$GITHUB_OUTPUT"
            echo "Windows code signing is enabled."
          else
            echo "windows_signing=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Tag releases require the WINDOWS_CERTIFICATE_BASE64 repository secret; unsigned releases are blocked."
              exit 1
            fi
            echo "::warning::Manual build only: Windows artifacts will be unsigned and include a signing status report."
          fi

  # ═══════════════════════════════════════════
  # ARM64 deb + tar.gz
  # ═══════════════════════════════════════════
  build-arm64:
    name: ARM64 Linux (deb + tar.gz)
    needs: release-preflight
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Cache Rust & Node
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            node_modules
          key: arm64-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: arm64-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        working-directory: src-tauri
        run: cargo build --release --bin workflow-engine --bin wf-cli

      - name: Package deb
        run: |
          set -ex
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          fi
          DEB_ARCH=arm64
          echo "=== Packaging deb v${VERSION} for ${DEB_ARCH} ==="
          ls src-tauri/target/release/workflow-engine src-tauri/target/release/wf-cli
          ls -d dist/ src-tauri/sidecars/ debian/
          mkdir -p pkg/opt/workflow-engine pkg/usr/lib/systemd/user pkg/DEBIAN
          cp src-tauri/target/release/workflow-engine pkg/opt/workflow-engine/
          cp src-tauri/target/release/wf-cli pkg/opt/workflow-engine/
          cp -r dist pkg/opt/workflow-engine/
          cp -r src-tauri/sidecars pkg/opt/workflow-engine/
          cp src-tauri/node-schema.json pkg/opt/workflow-engine/
          if [ -f debian/wf-engine.service ]; then
            cp debian/wf-engine.service pkg/usr/lib/systemd/user/
          fi
          if [ -f debian/postinst ]; then
            cp debian/postinst pkg/DEBIAN/
            chmod 755 pkg/DEBIAN/postinst
          fi
          # 动态生成 DEBIAN/control（修正版本和架构）
          sed -e "s/^Version:.*/Version: ${VERSION}/" \
              -e "s/^Architecture:.*/Architecture: ${DEB_ARCH}/" \
              debian/control > pkg/DEBIAN/control
          cat pkg/DEBIAN/control
          mkdir -p pkg/opt/workflow-engine/data/logs
          dpkg-deb --build pkg workflow-engine_${VERSION}_${DEB_ARCH}.deb

      - name: Package tar.gz (standalone)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          fi
          TARGZ=workflow-engine-${VERSION}-linux-arm64.tar.gz
          mkdir -p /tmp/wf-pkg
          cp src-tauri/target/release/workflow-engine /tmp/wf-pkg/
          cp src-tauri/target/release/wf-cli /tmp/wf-pkg/
          cp -r dist /tmp/wf-pkg/
          cp -r src-tauri/sidecars /tmp/wf-pkg/
          cp src-tauri/node-schema.json /tmp/wf-pkg/
          tar czf $TARGZ -C /tmp/wf-pkg .

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: workflow-engine-arm64-deb
          path: workflow-engine_*_arm64.deb

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: workflow-engine-arm64-tarball
          path: workflow-engine-*-linux-arm64.tar.gz

  # ═══════════════════════════════════════════
  # x86_64 deb + tar.gz
  # ═══════════════════════════════════════════
  build-x64:
    name: x86_64 Linux (deb + tar.gz)
    needs: release-preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
